name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test ./... -race -count=1

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f docker/Dockerfile .

  sbom:
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image for SBOM
        run: docker build -t noctaxris-az:ci-sbom -f docker/Dockerfile .
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: noctaxris-az:ci-sbom
          format: spdx-json
          output-file: noctaxris-az-sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctaxris-az-sbom
          path: noctaxris-az-sbom.spdx.json

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # Pin module version (not @latest) for supply-chain reproducibility.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        # Native govulncheck has no per-ID exclude. scripts/govulncheck-ci still
        # fails on any non-allowlisted finding; Docker Engine Fixed N/A IDs are
        # listed in scripts/govulncheck-allowlist.txt (see docs/security-defaults.md).
        run: go run ./scripts/govulncheck-ci
