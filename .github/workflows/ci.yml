name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nested DinD is not on every PR; weekly main smoke keeps the contract honest.
    - cron: "32 6 * * 1"
  workflow_dispatch:
    inputs:
      nested_smoke:
        description: Run nested DinD smoke (engine healthy, ARM Redis with engine overlay)
        type: boolean
        default: false
      integration_suites:
        description: Run SDK / Terraform integration suites against Compose
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./... -count=1

  compose-static:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compose static checks
        run: go test ./docker/ -count=1

  govulncheck:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # Pin module version (not @latest) for supply-chain reproducibility.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck
        # Native govulncheck has no per-ID exclude. scripts/govulncheck-ci still
        # fails on any non-allowlisted finding; allowlist is empty by default after
        # the moby client migration (see scripts/govulncheck-allowlist.txt and
        # docs/security-defaults.md).
        run: go run ./scripts/govulncheck-ci

  race:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scoped race tests (kernel + store)
        run: go test ./internal/kernel/... ./internal/store/... -race -count=1 -timeout 30m

  image:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f docker/Dockerfile .

  sbom:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [image]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image for SBOM
        run: docker build -t noctaxris-az:ci-sbom -f docker/Dockerfile .
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: noctaxris-az:ci-sbom
          format: spdx-json
          output-file: noctaxris-az-sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: noctaxris-az-sbom
          path: noctaxris-az-sbom.spdx.json

  smoke-core:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [unit, compose-static, image]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Compose env
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          ROOT_ID="$(openssl rand -hex 16)"
          ROOT_TOKEN="$(openssl rand -hex 32)"
          SUB="00000000-0000-0000-0000-000000000002"
          awk -v id="$ROOT_ID" -v token="$ROOT_TOKEN" '
            /^NOCTAXRIS_AZ_ROOT_CLIENT_ID=/ { print "NOCTAXRIS_AZ_ROOT_CLIENT_ID=" id; next }
            /^NOCTAXRIS_AZ_ROOT_ACCESS_TOKEN=/ { print "NOCTAXRIS_AZ_ROOT_ACCESS_TOKEN=" token; next }
            { print }
          ' docker/.env > docker/.env.tmp
          mv docker/.env.tmp docker/.env
          {
            echo "ROOT_TOKEN=${ROOT_TOKEN}"
            echo "SUB=${SUB}"
          } >> "$GITHUB_ENV"
      - name: Compose up
        run: docker compose -f docker/compose.yaml --env-file docker/.env up --build -d
      - name: Wait for readiness
        run: |
          # Stock compose serves HTTPS (NOCTAXRIS_AZ_TLS_AUTO=1). Use -k for the lab CA.
          for i in $(seq 1 60); do
            if curl -fsSk https://127.0.0.1:4599/_noctaxris-az/ready | grep -q ok; then
              echo "ready"
              exit 0
            fi
            sleep 5
          done
          echo "API never became ready" >&2
          docker compose -f docker/compose.yaml --env-file docker/.env logs --no-color || true
          exit 1
      - name: Core REST smoke (subscription / RG / Storage / Key Vault)
        env:
          EP: https://127.0.0.1:4599
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${ROOT_TOKEN}"
          curl -fsSk -H "$AUTH" \
            "${EP}/subscriptions/${SUB}?api-version=2022-12-01" | grep -q "${SUB}"
          curl -fsSk -H "$AUTH" -H "Content-Type: application/json" \
            -X PUT \
            -d '{"location":"eastus"}' \
            "${EP}/subscriptions/${SUB}/resourcegroups/rg-ci?api-version=2022-09-01" | grep -q rg-ci
          curl -fsSk -H "$AUTH" -H "Content-Type: application/json" \
            -X PUT \
            -d '{"location":"eastus","kind":"StorageV2","sku":{"name":"Standard_LRS"}}' \
            "${EP}/subscriptions/${SUB}/resourcegroups/rg-ci/providers/Microsoft.Storage/storageAccounts/stci?api-version=2023-01-01" | grep -q stci
          curl -fsSk -H "$AUTH" -H "Content-Type: application/json" \
            -X PUT \
            -d '{"location":"eastus","properties":{}}' \
            "${EP}/subscriptions/${SUB}/resourcegroups/rg-ci/providers/Microsoft.KeyVault/vaults/kv-ci?api-version=2022-07-01" | grep -q kv-ci
          curl -fsSk -H "$AUTH" -H "Content-Type: application/json" \
            -X PUT \
            -d '{"value":"smoke-core"}' \
            "${EP}/keyvault/kv-ci/secrets/demo" | grep -q demo
      - name: Audit hygiene (root token absent)
        env:
          ROOT_TOKEN: ${{ env.ROOT_TOKEN }}
        run: |
          set -euo pipefail
          CID=$(docker compose -f docker/compose.yaml --env-file docker/.env ps -q noctaxris-az)
          docker run --rm --volumes-from "$CID" -e ROOT_TOKEN busybox \
            sh -c 'test -f /var/lib/noctaxris-az/audit/audit.jsonl && ! grep -Fq "$ROOT_TOKEN" /var/lib/noctaxris-az/audit/audit.jsonl'
      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.yaml --env-file docker/.env down -v

  smoke-nested:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.nested_smoke)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Require Docker
        id: docker
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "Docker unavailable; skipping nested smoke"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Nested DinD smoke
        if: steps.docker.outputs.skip != 'true'
        env:
          READY_TIMEOUT_SEC: "240"
        run: bash docker/smoke-nested.sh

  integration-suites:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.integration_suites) ||
      github.event_name == 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            tests:
              - 'tests/**'
              - '.github/workflows/ci.yml'
      - name: Decide whether to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.filter.outputs.tests }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.decide.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install Terraform
        if: steps.decide.outputs.run == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Prepare Compose env
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          ROOT_ID="$(openssl rand -hex 16)"
          ROOT_TOKEN="$(openssl rand -hex 32)"
          SUB="00000000-0000-0000-0000-000000000002"
          awk -v id="$ROOT_ID" -v token="$ROOT_TOKEN" '
            /^NOCTAXRIS_AZ_ROOT_CLIENT_ID=/ { print "NOCTAXRIS_AZ_ROOT_CLIENT_ID=" id; next }
            /^NOCTAXRIS_AZ_ROOT_ACCESS_TOKEN=/ { print "NOCTAXRIS_AZ_ROOT_ACCESS_TOKEN=" token; next }
            { print }
          ' docker/.env > docker/.env.tmp
          mv docker/.env.tmp docker/.env
          {
            echo "ROOT_TOKEN=${ROOT_TOKEN}"
            echo "NOCTAXRIS_AZ_ROOT_ACCESS_TOKEN=${ROOT_TOKEN}"
            echo "NOCTAXRIS_AZ_ENDPOINT=https://127.0.0.1:4599"
            echo "NOCTAXRIS_AZ_SUBSCRIPTION_ID=${SUB}"
          } >> "$GITHUB_ENV"
      - name: Compose up
        if: steps.decide.outputs.run == 'true'
        run: docker compose -f docker/compose.yaml --env-file docker/.env up --build -d
      - name: Wait for readiness
        if: steps.decide.outputs.run == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://127.0.0.1:4599/_noctaxris-az/ready | grep -q ok; then
              echo "ready"
              exit 0
            fi
            sleep 5
          done
          echo "API never became ready" >&2
          docker compose -f docker/compose.yaml --env-file docker/.env logs --no-color || true
          exit 1
      - name: Run SDK + Terraform suites
        if: steps.decide.outputs.run == 'true'
        env:
          NOCTAXRIS_AZ_ENDPOINT: https://127.0.0.1:4599
        run: bash tests/run-all.sh
      - name: Compose down
        if: always() && steps.decide.outputs.run == 'true'
        run: docker compose -f docker/compose.yaml --env-file docker/.env down -v
