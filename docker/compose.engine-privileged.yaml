# Opt-in full-privileged nested engine overlay (not wired yet).
# Prefer compose.engine.yaml alone once nested DinD lands; add this overlay
# only when restricted DinD cannot start nested containers.
#
# Usage (from docker/, once engine exists):
#   docker compose -f compose.yaml -f compose.engine.yaml -f compose.engine-privileged.yaml --env-file .env up --build
#
# Keep host publish on 127.0.0.1:4599. Never add host docker.sock on the API.
services: {}
